<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Period Stories</title>
<style>
body { font-family: Arial; margin:0; background:#fff0f5; }
header { background:#e91e63; color:white; text-align:center; padding:20px; }
.container { padding:20px; max-width:900px; margin:auto; }
.card { background:white; padding:15px; margin:15px 0; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
button { background:#e91e63; color:white; border:none; padding:8px 12px; border-radius:5px; cursor:pointer; }
.viewer { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); }
.viewer-content { background:white; margin:10% auto; padding:20px; width:80%; border-radius:10px; }
</style>
</head>
<body><header>
<h1>🌸 Period Awareness Stories</h1>
<p>Learn through real-life inspired stories</p>
</header><div class="container" id="stories"></div><div class="viewer" id="viewer">
  <div class="viewer-content">
    <h2 id="title"></h2>
    <p id="content"></p>
    <button onclick="closeStory()">Close</button>
  </div>
</div><script>
const stories = [
  {
    title: "Her First Period",
    content: "Riya was scared when she saw blood for the first time. She thought something was wrong. But her mother calmly explained that it was her first period — a natural part of growing up. That day, fear turned into understanding."
  },
  {
    title: "School Day Surprise",
    content: "Ananya got her period at school unexpectedly. She felt embarrassed, but her friend helped her and shared a pad. That moment taught her the importance of support and awareness."
  },
  {
    title: "Breaking the Myth",
    content: "Meera was told not to enter the kitchen during her periods. But she questioned it and learned that periods are natural, not something to be ashamed of. She helped change her family’s thinking."
  }
];

function loadStories(){
  const container = document.getElementById('stories');
  stories.forEach((s, index)=>{
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `<h3>${s.title}</h3><button onclick="openStory(${index})">Read Story</button>`;
    container.appendChild(div);
  });
}

function openStory(i){
  document.getElementById('title').innerText = stories[i].title;
  document.getElementById('content').innerText = stories[i].content;
  document.getElementById('viewer').style.display='block';
}

function closeStory(){
  document.getElementById('viewer').style.display='none';
}

loadStories();
</script></body>
</html>
